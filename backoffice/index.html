<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Bealatriz · Backoffice</title>
  <meta http-equiv="refresh" content="0; url=https://script.google.com/a/macros/bealatriz.com/s/AKfycbyUboSnNfLWwwx28pUqIErWkP4OdzNGved9QPAYkRUbM08sjz7QRERkO9FwQACk0yWE/exec">
  <style>
    :root{color-scheme:dark;}
    *{box-sizing:border-box;margin:0;}
    html,body{height:100%;}
    body{display:flex;align-items:center;justify-content:center;min-height:100vh;
      font-family:'Jost',system-ui,-apple-system,sans-serif;color:#eee;
      background:radial-gradient(120% 85% at 50% 12%,rgba(190,245,120,.14),transparent 52%),
                 radial-gradient(120% 100% at 85% 92%,rgba(96,150,220,.16),transparent 55%),
                 linear-gradient(160deg,#17293f 0%,#0d1521 52%,#070b12 100%);}
    .box{text-align:center;padding:24px;}
    .spin{width:46px;height:46px;border-radius:50%;margin:0 auto 22px;
      border:3px solid rgba(255,255,255,.15);border-top-color:#c6f24f;
      animation:sp 1s linear infinite;}
    @keyframes sp{to{transform:rotate(360deg);}}
    h1{font-size:22px;font-weight:600;letter-spacing:1px;margin-bottom:8px;}
    p{opacity:.75;font-size:14px;margin-bottom:22px;}
    a{display:inline-block;color:#16240a;background:linear-gradient(135deg,#c6f24f,#7bbf2e);
      text-decoration:none;padding:11px 22px;border-radius:10px;font-weight:700;font-size:13px;
      letter-spacing:1px;box-shadow:0 8px 22px rgba(123,191,46,.35);}
  </style>
</head>
<body>
  <div class="box">
    <div class="spin"></div>
    <h1>Bealatriz · Backoffice</h1>
    <p>Abriendo el panel de gestión…</p>
    <a id="go" href="https://script.google.com/a/macros/bealatriz.com/s/AKfycbyUboSnNfLWwwx28pUqIErWkP4OdzNGved9QPAYkRUbM08sjz7QRERkO9FwQACk0yWE/exec">Entrar manualmente</a>
  </div>
  <script>
    location.replace(document.getElementById('go').href);
  </script>
</body>
</html>
